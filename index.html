<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="theme-color" content="#0E1A24">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Carnet de poche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout : app iPhone. Barre du voyage sombre en haut ; écrans en groupes iOS (titre hors de la carte, action à droite) ;
   onglets fixes en bas ; fiches qui montent du bas. Une seule pièce forte : le billet sur la couverture.
   Typo : Barlow (texte) + Barlow Condensed (titres, chiffres, codes), chiffres tabulaires, pas de capitales espacées. */
:root{
  --bg:#EDF1F4;--surface:#FFFFFF;--surface-2:#F4F7F9;--line:#E3E9EE;--line-2:#CCD6DD;--fg:#0F1E2A;--muted:#55636E;--faint:#E6ECF0;--hover:rgba(15,30,42,.06);
  --bar:rgba(237,241,244,.9);--bar-line:rgba(15,30,42,.08);
  --top:#0E1A24;--top-fg:#E8EFF3;--top-muted:#9DB0BD;
  --sun:#F2B544;--sun-ink:#0E1A24;--sun-soft:#FDF1D8;--sun-soft-ink:#7A5208;
  --danger:#A3361A;--danger-soft:#FBEFEA;--danger-line:#E3B9AA;--info:#2A5599;--ok:#12603E;--ok-soft:#E4F3EC;
  --pv-bg:#FFF1E7;--pv-fg:#93380C;--pv-line:#F0C3A4;
  --rs-bg:#E8F0FB;--rs-fg:#1F4E8C;--rs-line:#BCD0EC;
  --pd-bg:#E4F3EC;--pd-fg:#12603E;--pd-line:#B1DAC5;
  --tr-bg:#E6EEFA;--tr-fg:#2A5599;--rp-bg:#FBF2DA;--rp-fg:#86640C;--dt-bg:#F3E8F5;--dt-fg:#7A3E8F;
  --idea-bg:#FFFBF0;--idea-line:#F1E2BC;
  --flap:#0F1E2A;--overlay:rgba(14,26,36,.5);--toast:#0F1E2A;--toast-fg:#FFFFFF;
  --pass-drop:0 18px 30px -12px rgba(14,26,36,.42);--pass-line:transparent;
  --acc:#0B7A75;--acc-ink-l:#0B7A75;--acc-ink-d:#5CCFC6;--soft-l:#E3F3F1;--soft-d:#10302E;
  --acc-ink:var(--acc-ink-l);--soft:var(--soft-l);
  --display:'Barlow Condensed','Avenir Next Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',-apple-system,system-ui,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B141B;--surface:#14212B;--surface-2:#192833;--line:#22323E;--line-2:#34485A;--fg:#E6EEF3;--muted:#9AAAB6;--faint:#22323D;--hover:rgba(255,255,255,.06);
    --bar:rgba(11,20,27,.9);--bar-line:rgba(255,255,255,.07);
    --top:#070E14;--top-fg:#E6EEF3;--top-muted:#8FA2B0;
    --sun-soft:#3A2F14;--sun-soft-ink:#F5CF7A;
    --danger:#F08A6A;--danger-soft:#3A1E16;--danger-line:#6B3424;--info:#8FB4F0;--ok:#8FD9B0;--ok-soft:#12301F;
    --pv-bg:#3A2213;--pv-fg:#F7B58A;--pv-line:#6B3A1E;
    --rs-bg:#172A44;--rs-fg:#9CC0F0;--rs-line:#2D4A70;
    --pd-bg:#12301F;--pd-fg:#8FD9B0;--pd-line:#245A3A;
    --tr-bg:#172A44;--tr-fg:#9CC0F0;--rp-bg:#33290F;--rp-fg:#E8C766;--dt-bg:#2E1C34;--dt-fg:#D3A6E0;
    --idea-bg:#1D1A10;--idea-line:#3A321A;
    --flap:#05090D;--overlay:rgba(0,0,0,.62);--toast:#E6EEF3;--toast-fg:#0F1E2A;
    --pass-drop:0 18px 30px -10px rgba(0,0,0,.8);--pass-line:#2A3B48;
    --acc-ink:var(--acc-ink-d);--soft:var(--soft-d);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B141B;--surface:#14212B;--surface-2:#192833;--line:#22323E;--line-2:#34485A;--fg:#E6EEF3;--muted:#9AAAB6;--faint:#22323D;--hover:rgba(255,255,255,.06);
  --bar:rgba(11,20,27,.9);--bar-line:rgba(255,255,255,.07);
  --top:#070E14;--top-fg:#E6EEF3;--top-muted:#8FA2B0;
  --sun-soft:#3A2F14;--sun-soft-ink:#F5CF7A;
  --danger:#F08A6A;--danger-soft:#3A1E16;--danger-line:#6B3424;--info:#8FB4F0;--ok:#8FD9B0;--ok-soft:#12301F;
  --pv-bg:#3A2213;--pv-fg:#F7B58A;--pv-line:#6B3A1E;
  --rs-bg:#172A44;--rs-fg:#9CC0F0;--rs-line:#2D4A70;
  --pd-bg:#12301F;--pd-fg:#8FD9B0;--pd-line:#245A3A;
  --tr-bg:#172A44;--tr-fg:#9CC0F0;--rp-bg:#33290F;--rp-fg:#E8C766;--dt-bg:#2E1C34;--dt-fg:#D3A6E0;
  --idea-bg:#1D1A10;--idea-line:#3A321A;
  --flap:#05090D;--overlay:rgba(0,0,0,.62);--toast:#E6EEF3;--toast-fg:#0F1E2A;
  --pass-drop:0 18px 30px -10px rgba(0,0,0,.8);--pass-line:#2A3B48;
  --acc-ink:var(--acc-ink-d);--soft:var(--soft-d);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{background:var(--top)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
img{max-width:100%}[hidden]{display:none!important}
h1,h2,h3{text-wrap:balance}
.app{max-width:600px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:calc(168px + env(safe-area-inset-bottom,0px))}
.disp{font-family:var(--display);letter-spacing:0}
.num{font-variant-numeric:tabular-nums lining-nums}
.kick{font-size:13px;font-weight:600;color:var(--muted);line-height:1.3}
.muted{color:var(--muted)}
.sm{font-size:14px}
.b{font-weight:600}
.urgent{color:var(--danger)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* barre du haut */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:4px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;background:var(--top);color:var(--top-fg)}
.top .muted{color:var(--top-muted)}
.trip-btn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:48px;padding:4px 8px 4px 4px;border:0;background:transparent;border-radius:14px;cursor:pointer;text-align:left;color:inherit}
.trip-btn:active,.top .icon-btn:active{background:rgba(255,255,255,.08)}
.trip-name{display:block;font-family:var(--display);font-size:23px;font-weight:700;line-height:1.05}
.trip-meta{display:block;font-size:14px;line-height:1.35}
.stub{width:42px;height:42px;border-radius:11px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;color:#FFFFFF;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.03em}
.icon-btn{width:44px;height:44px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;background:transparent;color:inherit;cursor:pointer}
.offline{display:inline-block;font-size:12px;font-weight:600;color:#0E1A24;background:var(--sun);border-radius:99px;padding:0 7px;margin-right:6px;line-height:18px}

/* écrans : groupes à la iOS */
.screen{padding:16px 16px 0;display:flex;flex-direction:column;gap:24px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 4px;min-height:32px}
.h2{margin:0;font-family:var(--display);font-size:25px;font-weight:600;line-height:1.1;letter-spacing:0}
.h3{margin:0;font-family:var(--display);font-size:21px;font-weight:600;line-height:1.1}
.card{background:var(--surface);border:1px solid transparent;border-radius:16px}
.pad{padding:16px}
.link{border:0;background:none;color:var(--acc-ink);font-weight:600;font-size:15px;cursor:pointer;padding:6px 0;min-height:36px}
.hs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px;-webkit-overflow-scrolling:touch;scroll-padding:0 16px}
.hs::-webkit-scrollbar{display:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tap{cursor:pointer;text-align:left;transition:transform .12s}
.tap:active{transform:scale(.98)}

/* couverture + billet */
.cover{position:relative;overflow:hidden;border-radius:26px;height:218px}
.cover svg{position:absolute;inset:0;width:100%;height:100%}
.cover-in{position:relative;padding:18px 20px;max-width:80%}
.cover-t{margin:0;font-size:56px;font-weight:700;line-height:.9;letter-spacing:-.005em}
.cover-sub{margin-top:6px;font-size:15px;font-weight:600}
.pass-wrap{position:relative;margin:-64px 10px 0}
.pass-wrap::before{content:'';position:absolute;inset:14px 6px 0;border-radius:18px;box-shadow:var(--pass-drop)}
.pass{--stub:112px;--notch:9px;position:relative;display:flex;background:var(--surface);border:1px solid var(--pass-line);border-radius:18px;overflow:hidden;
  -webkit-mask:radial-gradient(circle var(--notch) at calc(100% - var(--stub)) 0,transparent 97%,#000) top/100% 51% no-repeat,radial-gradient(circle var(--notch) at calc(100% - var(--stub)) 100%,transparent 97%,#000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle var(--notch) at calc(100% - var(--stub)) 0,transparent 97%,#000) top/100% 51% no-repeat,radial-gradient(circle var(--notch) at calc(100% - var(--stub)) 100%,transparent 97%,#000) bottom/100% 51% no-repeat}
.pass-main{flex:1;min-width:0;padding:13px 14px 12px;display:flex;flex-direction:column;gap:10px}
.pass-codes{display:flex;align-items:center;gap:8px}
.pass-code{font-family:var(--display);font-size:38px;font-weight:700;line-height:.9;letter-spacing:.01em}
.pass-line{flex:1;display:flex;align-items:center;gap:6px;color:var(--acc-ink);min-width:24px}
.pass-line span{flex:1;border-top:2px dotted var(--line-2)}
.pass-row{display:flex;justify-content:space-between;gap:10px}
.pf{display:flex;flex-direction:column;min-width:0}
.pf-l{font-size:12px;color:var(--muted);line-height:1.25}
.pf-v{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.1;white-space:nowrap}
.pf-d{font-size:15px;font-weight:600;line-height:1.25;white-space:nowrap}
.pass-fields{justify-content:flex-start;gap:16px;padding-top:9px;border-top:1px solid var(--line)}
.pass-stub{width:var(--stub);flex:0 0 auto;border-left:2px dashed var(--line-2);background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 6px;text-align:center}
.flap{position:relative;display:inline-flex;align-items:center;justify-content:center;width:31px;height:46px;border-radius:6px;background:var(--flap);color:#FFFFFF;font-family:var(--display);font-size:32px;font-weight:600;transform-origin:50% 50%}
.flap::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.22)}
.flap.anim{animation:flip .6s cubic-bezier(.3,.7,.3,1.25) both}
@keyframes flip{0%{transform:perspective(220px) rotateX(-100deg);opacity:.15}65%{transform:perspective(220px) rotateX(14deg);opacity:1}100%{transform:none}}

/* aujourd'hui */
.today{background:var(--top);color:var(--top-fg);border:0}
.today .muted{color:var(--top-muted)}
.today-stat{background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px}

/* route */
.leg{flex:1 0 108px;text-align:left;background:none;border:0;padding:8px 4px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;gap:7px}
.leg:active{background:var(--hover)}

/* budget */
.donut{position:relative;width:124px;height:124px;border-radius:50%;flex:0 0 auto}
.donut-in{position:absolute;inset:18px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring{width:52px;height:52px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.ring-in{width:40px;height:40px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--faint);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px}
.sq{width:10px;height:10px;border-radius:3px;flex:0 0 auto;display:inline-block}
.dot{width:9px;height:9px;border-radius:99px;flex:0 0 auto;display:inline-block}
.big{font-family:var(--display);font-weight:600;line-height:1;font-variant-numeric:tabular-nums lining-nums}

/* listes */
.li{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 0;border:0;background:none;text-align:left;cursor:pointer}
.li-main:active{opacity:.55}
.li-t{display:block;font-weight:600;line-height:1.25}
.li-s{display:block;font-size:14px;color:var(--muted);line-height:1.35}
.li-r{flex:0 0 auto;text-align:right}
/* ligne de dépense : toute la ligne s'ouvre, le statut reste un bouton à part */
.lx{position:relative;display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.lx:first-child{border-top:0}
.lx-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding-top:1px}
.lx-open{display:block;width:100%;padding:0;border:0;background:none;text-align:left;font-weight:600;line-height:1.25;color:var(--fg);cursor:pointer}
.lx-open::after{content:'';position:absolute;inset:0 -8px;border-radius:12px}
.lx-open:active::after{background:var(--hover)}
.lx-open:focus-visible{outline:none}
.lx-open:focus-visible::after{outline:2px solid var(--acc);outline-offset:-2px}
.lx-r{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:1px}
.lx-amt{font-size:17px;font-weight:600;line-height:1.25;white-space:nowrap}
.lx-loc{font-size:13px;color:var(--muted);white-space:nowrap}
.lx-r .chip{position:relative;z-index:1;margin-top:6px}
.chip{display:inline-flex;align-items:center;justify-content:center;min-height:32px;min-width:76px;padding:0 10px;border-radius:99px;font-size:13px;font-weight:600;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.chip:active{transform:scale(.95)}
.s-prevu,.st-todo{background:var(--pv-bg);color:var(--pv-fg);border-color:var(--pv-line)}
.s-reserve,.st-booked{background:var(--rs-bg);color:var(--rs-fg);border-color:var(--rs-line)}
.s-paye,.st-done{background:var(--pd-bg);color:var(--pd-fg);border-color:var(--pd-line)}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px 0 12px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;flex:0 0 auto;color:var(--fg)}
.pill.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:flex;background:var(--faint);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg-s button{min-height:34px;font-size:14px}
.ico{width:40px;height:40px;border-radius:12px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}
.ico-s{width:36px;height:36px;border-radius:10px;background:var(--surface-2)}
.ty-act{background:var(--soft);color:var(--acc-ink)}.ty-trajet{background:var(--tr-bg);color:var(--tr-fg)}.ty-repas{background:var(--rp-bg);color:var(--rp-fg)}.ty-detente{background:var(--dt-bg);color:var(--dt-fg)}
.bg{border-top:1px solid var(--line);padding:2px 0 12px}
.bg:first-child{border-top:0}
.bg-head{width:100%;display:flex;align-items:center;gap:10px;min-height:58px;border:0;background:none;padding:8px 0 10px;cursor:pointer;text-align:left;color:var(--fg)}
.bg-head:active{opacity:.6}
.bg-chev{display:inline-flex;transition:transform .2s}
.bg.open .bg-chev{transform:rotate(180deg)}
.bg-body{margin-top:10px;padding:2px 12px 12px;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px;animation:fade .2s ease}
.bg-body .li-main{min-height:54px}
.chip-s{min-width:0;min-height:30px;padding:0 9px;font-size:12px}
.tl{position:relative;display:flex;gap:12px;align-items:flex-start;padding-bottom:14px}
.tl::before{content:'';position:absolute;left:21px;top:56px;bottom:2px;width:2px;background:var(--faint)}
.tl.last{padding-bottom:0}.tl.last::before{display:none}
.tl-date{width:44px;height:50px;flex:0 0 auto;border-radius:12px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.k-cancel{color:var(--danger)}.k-charge{color:var(--info)}.k-go{color:var(--acc-ink)}
.nx{display:flex;gap:12px;padding:11px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;color:var(--fg)}
.nx:first-child{border-top:0}

/* jours */
.day{position:relative;overflow:hidden;flex:0 0 auto;width:58px;min-height:78px;padding-top:5px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:var(--fg)}
.day.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.day.is-today:not(.on){border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.day-band{position:absolute;top:0;left:0;right:0;height:5px}
.dw{font-size:13px;font-weight:500;color:var(--muted)}
.day.on .dw{color:var(--bg);opacity:.75}
.dn{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.dc{font-size:12px;font-weight:600;color:var(--muted);min-height:16px}
.day.on .dc{color:var(--sun)}

/* valise */
.ckrow{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--line)}
.ckrow:first-child{border-top:0}
.ck{width:26px;height:26px;accent-color:var(--acc);flex:0 0 auto;margin:0}
.ckl{flex:1;padding:12px 0;cursor:pointer}
.ckrow.done .ckl{text-decoration:line-through;color:var(--muted)}

/* champs */
.field{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);font-size:16px;color:var(--fg);-webkit-appearance:none;appearance:none}
select.field{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
input[type=date].field,input[type=time].field{line-height:46px;text-align:left}
input[type=date].field::-webkit-date-and-time-value,input[type=time].field::-webkit-date-and-time-value{text-align:left}
.field:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
.lbl{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:0 0 6px 2px}
.datef{position:relative}
.datef .ph{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;display:none;font-size:16px}
.datef[data-empty="1"] .ph{display:block}
.datef[data-empty="1"] input{color:transparent}
.datef .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.datef[data-empty="1"] .clr{display:none}
.notebook{width:100%;min-height:220px;resize:vertical;border:0;padding:4px 2px;font-size:16px;line-height:30px;color:var(--fg);background-color:transparent;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,var(--faint) 29px,var(--faint) 30px);background-position:0 4px}
.notebook:focus{outline:none}
.amt-hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding:4px 0 2px}
.amt-row{display:flex;align-items:baseline;justify-content:center;gap:8px;width:100%}
.amt-input{width:2ch;min-width:1.2ch;max-width:calc(100% - 70px);border:0;background:transparent;text-align:right;font-family:var(--display);font-size:64px;font-weight:600;line-height:1.05;padding:0;color:var(--fg);caret-color:var(--acc)}
.amt-input:focus{outline:none}
.amt-input::placeholder{color:var(--line-2)}
.amt-cur{font-family:var(--display);font-size:30px;font-weight:600;color:var(--muted);min-width:56px}
.amt-conv{font-size:15px;color:var(--muted);min-height:20px}
.cat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cat{min-height:66px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:14px;font-weight:600;cursor:pointer;color:var(--fg);padding:6px 4px;text-align:center;line-height:1.2}
.cat svg{flex:0 0 auto}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;border:1px solid transparent;font-weight:600;font-size:17px;cursor:pointer;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--acc);color:#FFFFFF}
.btn-g{background:var(--surface);color:var(--fg);border-color:var(--line-2)}
.btn-d{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-line)}
.btn-ghost-d{background:transparent;color:var(--danger);border-color:var(--line-2)}
.btn-s{min-height:38px;padding:0 14px;font-size:15px;border-radius:11px}
.btn-w{width:100%}
.x-btn{width:40px;height:40px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer}

/* onglets bas + bouton + */
.tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:600px;z-index:15;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--bar);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--bar-line)}
.tabbar button{flex:1;min-height:52px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:12px}
.tabbar button.on{color:var(--acc-ink)}
.fab{position:fixed;right:max(16px,calc(50% - 284px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:14;width:60px;height:60px;border-radius:50%;border:0;background:var(--acc);color:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);cursor:pointer;transition:transform .12s}
.fab:active{transform:scale(.92)}

/* fiches */
.sheet-wrap{position:fixed;inset:0;z-index:30;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:600px;max-height:calc(100vh - 44px - env(safe-area-inset-top,0px));max-height:calc(100dvh - 44px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;animation:up .28s cubic-bezier(.2,.85,.25,1);will-change:transform}
.sh-bar{flex:0 0 auto;padding:6px 8px 4px;border-bottom:1px solid var(--line);touch-action:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line-2);margin:2px auto 4px}
.sh-head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;min-height:46px}
.sh-head h2{margin:0;font-family:var(--display);font-size:21px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.sh-cancel,.sh-ok{border:0;background:transparent;min-height:44px;padding:0 10px;font-size:17px;cursor:pointer;color:var(--acc-ink)}
.sh-cancel{justify-self:start}
.sh-ok{justify-self:end;font-weight:700}
.sh-body{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sh-form{display:flex;flex-direction:column;gap:18px}
.row2{display:flex;gap:10px}
.row2>*{flex:1;min-width:0}
.mood{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;text-align:left;color:var(--fg)}
.mood.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--fg) inset}
.tk{position:relative;display:flex;align-items:stretch;width:100%;text-align:left;border:1px solid var(--line);padding:0;border-radius:16px;background:var(--surface-2);cursor:pointer;color:var(--fg)}
.tk.on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg) inset}
.tk-stub{width:52px;flex:0 0 auto;border-radius:15px 0 0 15px;display:flex;align-items:center;justify-content:center;min-height:74px}
.tk-code{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:.12em;color:#FFFFFF}
.tk-body{flex:1;min-width:0;padding:11px 14px;display:flex;flex-direction:column;gap:2px;border-left:2px dashed var(--line-2)}
.note-box{border-radius:16px;padding:14px;background:var(--surface-2);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(156px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--toast);color:var(--toast-fg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:15px;z-index:40;box-shadow:0 18px 40px -18px rgba(0,0,0,.5);max-width:calc(100% - 32px);animation:pop .22s ease}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:10px;min-height:36px;padding:0 12px;font-size:14px;font-weight:600;cursor:pointer}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
button:focus-visible,.field:focus-visible,.ck:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:360px){.cover-t{font-size:46px}.pass{--stub:100px}.pass-code{font-size:31px}.flap{width:27px;height:42px;font-size:28px}.amt-input{font-size:54px}.pass-fields{gap:12px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

    if (kind === 'idea') { var v = String(ui.idea || '').trim(); if (!v) return; tr.activities.push({ id: uid(), day: '', time: '', title: v, place: '', cost: '', type: 'act', status: 'todo', order: now }); ui.idea = ''; commit(); toast('Idée ajoutée'); return; }
    if (kind === 'exp') {
      var amount = String(f.amount || '').replace(/[\s  ]/g, '').replace(',', '.');
      var label = String(f.label || '').trim();
      if (!label && !num(amount)) { f.err = 'Indiquez au moins un montant ou un libellé.'; renderSheet(); return; }
      if (!label) label = catOf(f.cat).l;
      var body = { label: label, amount: amount, cur: f.cur || 'EUR', cat: f.cat || 'autre', state: f.state || 'prevu', kind: f.kind || 'dep', stop: f.stop || '', ref: f.ref || '', deadline: f.deadline || '', charge: f.charge || '', note: f.note || '', date: f.date || '' };
      if (f.cur) ui.lastCur = f.cur; saveUi();
      if (f.id) { var e0 = find(tr.expenses, f.id); if (e0) Object.assign(e0, body); toast('Enregistré'); }
      else { tr.expenses.push(Object.assign({ id: uid(), when: '', order: now }, body)); toast('Ajouté : ' + (num(amount) ? (body.cur === 'LOC' && tr.currency !== 'EUR' ? eur(num(amount) / rateOf(tr)) : eur(num(amount))) : label)); }
      closeSheet(); commit(); return;
    }
    if (kind === 'act') {
      if (!String(f.title || '').trim()) { f.err = 'Indiquez ce que vous allez faire.'; renderSheet(); return; }
      var ab = { title: String(f.title).trim(), time: f.time || '', place: f.place || '', cost: String(f.cost || '').replace(',', '.'), type: f.type || 'act', status: f.status || 'todo', day: f.day || '' };
      if (f.id) { var a0 = find(tr.activities, f.id); if (a0) Object.assign(a0, ab); toast('Enregistré'); }
      else { tr.activities.push(Object.assign({ id: uid(), order: now }, ab)); if (ab.day) { ui.day = ab.day; ui.scrollDay = true; } toast('Ajouté au programme'); }
      closeSheet(); commit(); return;
    }
    if (kind === 'chk') {
      if (!String(f.label || '').trim()) return;
      tr.checklist.push({ id: uid(), group: f.group || 'Divers', label: String(f.label).trim(), done: false, order: now });
      f.label = ''; f.added = (f.added || 0) + 1; commit(); renderSheet();
      var inpEl = document.getElementById('c-label'); if (inpEl) inpEl.focus();
      return;
    }
  });

  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && ui.sheet) closeSheet(); });
  window.addEventListener('online', render);
  window.addEventListener('offline', render);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !ui.sheet) render(); });

  /* ============ hors ligne ============ */
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
  }

  render();
})();
</script>
