<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="theme-color" content="#0E1A24">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Carnet de poche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : app iPhone — barre du voyage en haut, écrans défilants, onglets fixes en bas, fiches qui montent du bas pour saisir. */
:root{
  --bg:#EDF1F4;--surface:#FFFFFF;--surface-2:#F5F8FA;--line:#E3E9EE;--line-2:#CCD6DD;--fg:#0F1E2A;--muted:#51606C;--faint:#E8EEF2;--hover:#EEF2F5;
  --bar:rgba(237,241,244,.88);--bar-line:rgba(15,30,42,.08);
  --sun:#F2B544;--sun-ink:#0E1A24;--sun-soft:#FDF1D8;--sun-soft-ink:#7A5208;
  --danger:#A3361A;--danger-soft:#FBEFEA;--danger-line:#E3B9AA;--info:#2A5599;--ok:#12603E;
  --pv-bg:#FFF1E7;--pv-fg:#93380C;--pv-line:#F0C3A4;
  --rs-bg:#E8F0FB;--rs-fg:#1F4E8C;--rs-line:#BCD0EC;
  --pd-bg:#E4F3EC;--pd-fg:#12603E;--pd-line:#B1DAC5;
  --tr-bg:#E6EEFA;--tr-fg:#2A5599;--rp-bg:#FBF2DA;--rp-fg:#86640C;--dt-bg:#F3E8F5;--dt-fg:#7A3E8F;
  --idea-bg:#FFFBF2;--idea-line:#F3E3BF;
  --flap:#0F1E2A;--overlay:rgba(14,26,36,.5);--toast:#0F1E2A;--toast-fg:#FFFFFF;
  --shadow:0 1px 0 rgba(15,30,42,.03),0 10px 28px -20px rgba(15,30,42,.25);
  --pass-shadow:0 18px 40px -22px rgba(14,26,36,.55);
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',sans-serif;
  --body:'IBM Plex Sans',-apple-system,system-ui,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B141B;--surface:#14212B;--surface-2:#192833;--line:#22323E;--line-2:#34485A;--fg:#E6EEF3;--muted:#9AAAB6;--faint:#22323D;--hover:#1C2C37;
    --bar:rgba(11,20,27,.88);--bar-line:rgba(255,255,255,.07);
    --sun:#F2B544;--sun-ink:#0E1A24;--sun-soft:#3A2F14;--sun-soft-ink:#F5CF7A;
    --danger:#F08A6A;--danger-soft:#3A1E16;--danger-line:#6B3424;--info:#8FB4F0;--ok:#8FD9B0;
    --pv-bg:#3A2213;--pv-fg:#F7B58A;--pv-line:#6B3A1E;
    --rs-bg:#172A44;--rs-fg:#9CC0F0;--rs-line:#2D4A70;
    --pd-bg:#12301F;--pd-fg:#8FD9B0;--pd-line:#245A3A;
    --tr-bg:#172A44;--tr-fg:#9CC0F0;--rp-bg:#33290F;--rp-fg:#E8C766;--dt-bg:#2E1C34;--dt-fg:#D3A6E0;
    --idea-bg:#221D10;--idea-line:#40361C;
    --flap:#05090D;--overlay:rgba(0,0,0,.62);--toast:#E6EEF3;--toast-fg:#0F1E2A;
    --shadow:0 1px 0 rgba(0,0,0,.25),0 10px 28px -20px rgba(0,0,0,.7);
    --pass-shadow:0 18px 40px -22px rgba(0,0,0,.85);
    color-scheme:dark;
  }
  :root:not([data-theme="light"]) .app{--soft:var(--soft-d);--acc-ink:var(--acc-ink-d)}
}
:root[data-theme="dark"]{
  --bg:#0B141B;--surface:#14212B;--surface-2:#192833;--line:#22323E;--line-2:#34485A;--fg:#E6EEF3;--muted:#9AAAB6;--faint:#22323D;--hover:#1C2C37;
  --bar:rgba(11,20,27,.88);--bar-line:rgba(255,255,255,.07);
  --sun:#F2B544;--sun-ink:#0E1A24;--sun-soft:#3A2F14;--sun-soft-ink:#F5CF7A;
  --danger:#F08A6A;--danger-soft:#3A1E16;--danger-line:#6B3424;--info:#8FB4F0;--ok:#8FD9B0;
  --pv-bg:#3A2213;--pv-fg:#F7B58A;--pv-line:#6B3A1E;
  --rs-bg:#172A44;--rs-fg:#9CC0F0;--rs-line:#2D4A70;
  --pd-bg:#12301F;--pd-fg:#8FD9B0;--pd-line:#245A3A;
  --tr-bg:#172A44;--tr-fg:#9CC0F0;--rp-bg:#33290F;--rp-fg:#E8C766;--dt-bg:#2E1C34;--dt-fg:#D3A6E0;
  --idea-bg:#221D10;--idea-line:#40361C;
  --flap:#05090D;--overlay:rgba(0,0,0,.62);--toast:#E6EEF3;--toast-fg:#0F1E2A;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 10px 28px -20px rgba(0,0,0,.7);
  --pass-shadow:0 18px 40px -22px rgba(0,0,0,.85);
  color-scheme:dark;
}
:root[data-theme="dark"] .app{--soft:var(--soft-d);--acc-ink:var(--acc-ink-d)}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
h1,h2,h3{text-wrap:balance}
.app{--soft:var(--soft-l);--acc-ink:var(--acc-ink-l);max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.disp{font-family:var(--display);letter-spacing:-0.02em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.kick{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.sm{font-size:13px}
.b{font-weight:600}
.urgent{color:var(--danger)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:6px;padding:8px 12px;background:rgba(14,26,36,.94);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);color:#E8EFF3;border-bottom:1px solid rgba(255,255,255,.06)}
.top .muted{color:#9DB0BD}
.top .icon-btn{color:#E8EFF3}
.top .icon-btn:active,.top .trip-btn:active{background:rgba(255,255,255,.08)}
.trip-btn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:48px;padding:4px 8px 4px 4px;border:0;background:transparent;border-radius:14px;cursor:pointer;text-align:left;color:inherit}
.stub{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;color:#FFFFFF;font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.06em}
.icon-btn{width:44px;height:44px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;background:transparent;color:var(--fg);cursor:pointer}
.icon-btn:active{background:var(--hover)}

/* écrans */
.screen{padding:14px 16px 0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.pad{padding:16px}
.c-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.h2{margin:0;font-family:var(--display);letter-spacing:-0.02em;font-size:20px;font-weight:600;line-height:1.15}
.link{border:0;background:none;color:var(--acc-ink);font-weight:600;font-size:14px;cursor:pointer;padding:6px 0;min-height:36px}
.hs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px;-webkit-overflow-scrolling:touch}
.hs::-webkit-scrollbar{display:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

/* couverture + carte d'embarquement */
.cover{position:relative;overflow:hidden;border-radius:24px;height:210px}
.cover svg{position:absolute;inset:0;width:100%;height:100%}
.cover-in{position:relative;padding:16px 18px;max-width:78%}
.cover-t{margin:4px 0 0;font-size:34px;font-weight:800;line-height:.98}
.pass{position:relative;margin:-58px 10px 0;background:var(--surface);border-radius:20px;box-shadow:var(--pass-shadow);display:flex;overflow:hidden;border:1px solid var(--line)}
.pass-main{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pass-codes{display:flex;align-items:center;gap:8px}
.pass-code{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1}
.pass-line{flex:1;display:flex;align-items:center;gap:6px;color:var(--acc-ink);min-width:24px}
.pass-line span{flex:1;border-top:2px dashed var(--line-2)}
.pass-stub{width:112px;flex:0 0 auto;border-left:2px dashed var(--line-2);background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 6px;text-align:center}
.flap{position:relative;display:inline-flex;align-items:center;justify-content:center;width:28px;height:40px;border-radius:7px;background:var(--flap);color:#FFFFFF;font-size:24px;font-weight:600}
.flap::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.22)}

/* route */
.leg{flex:1 0 108px;text-align:left;background:none;border:0;padding:8px 4px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;gap:7px}
.leg:active{background:var(--hover)}

/* budget */
.donut{position:relative;width:124px;height:124px;border-radius:50%;flex:0 0 auto}
.donut-in{position:absolute;inset:18px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring{width:52px;height:52px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.ring-in{width:40px;height:40px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--faint);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px}
.sq{width:10px;height:10px;border-radius:3px;flex:0 0 auto;display:inline-block}
.dot{width:9px;height:9px;border-radius:99px;flex:0 0 auto;display:inline-block}

/* listes */
.li{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 0;border:0;background:none;text-align:left;cursor:pointer}
.li-main:active{opacity:.6}
.li-t{display:block;font-weight:600;line-height:1.3}
.li-s{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.li-r{flex:0 0 auto;text-align:right}
.chip{display:inline-flex;align-items:center;justify-content:center;min-height:32px;min-width:78px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.s-prevu,.st-todo{background:var(--pv-bg);color:var(--pv-fg);border-color:var(--pv-line)}
.s-reserve,.st-booked{background:var(--rs-bg);color:var(--rs-fg);border-color:var(--rs-line)}
.s-paye,.st-done{background:var(--pd-bg);color:var(--pd-fg);border-color:var(--pd-line)}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px 0 12px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.pill.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:flex;background:var(--faint);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border:0;border-radius:9px;background:transparent;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ico{width:40px;height:40px;border-radius:12px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}
.ty-act{background:var(--soft);color:var(--acc-ink)}.ty-trajet{background:var(--tr-bg);color:var(--tr-fg)}.ty-repas{background:var(--rp-bg);color:var(--rp-fg)}.ty-detente{background:var(--dt-bg);color:var(--dt-fg)}
.tl{position:relative;display:flex;gap:12px;align-items:flex-start;padding-bottom:14px}
.tl::before{content:'';position:absolute;left:21px;top:56px;bottom:2px;width:2px;background:var(--faint)}
.tl.last{padding-bottom:0}.tl.last::before{display:none}
.tl-date{width:44px;height:50px;flex:0 0 auto;border-radius:13px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.k-cancel{color:var(--danger)}.k-charge{color:var(--info)}.k-go{color:var(--acc-ink)}

/* jours */
.day{position:relative;overflow:hidden;flex:0 0 auto;width:58px;min-height:76px;padding-top:5px;border-radius:15px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.day.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.day-band{position:absolute;top:0;left:0;right:0;height:5px}
.dw{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.day.on .dw{color:var(--bg);opacity:.75}
.dc{font-size:10px;font-weight:600;color:var(--muted);min-height:14px}
.day.on .dc{color:var(--sun)}

/* valise */
.ckrow{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--line)}
.ckrow:first-of-type{border-top:0}
.ck{width:26px;height:26px;accent-color:var(--acc);flex:0 0 auto;margin:0}
.ckl{flex:1;padding:12px 0;cursor:pointer}
.ckrow.done .ckl{text-decoration:line-through;color:var(--muted)}

/* champs */
.field{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line-2);border-radius:13px;background:var(--surface);font-size:16px;color:var(--fg);-webkit-appearance:none;appearance:none}
select.field{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
input[type=date].field,input[type=time].field{line-height:46px}
.field:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px 2px;letter-spacing:.04em}
.notebook{width:100%;min-height:220px;resize:vertical;border:0;padding:4px 2px;font-size:16px;line-height:30px;color:var(--fg);background-color:transparent;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,var(--faint) 29px,var(--faint) 30px);background-position:0 4px}
.notebook:focus{outline:none}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;border:1px solid transparent;font-weight:600;font-size:16px;cursor:pointer;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--acc);color:#FFFFFF}
.btn-g{background:var(--surface);color:var(--fg);border-color:var(--line-2)}
.btn-d{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-line)}
.btn-s{min-height:38px;padding:0 14px;font-size:14px;border-radius:11px}
.btn-w{width:100%}
.x-btn{width:40px;height:40px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer}

/* onglets bas + bouton + */
.tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:600px;z-index:15;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--bar);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--bar-line)}
.tabbar button{flex:1;min-height:52px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:12px}
.tabbar button.on{color:var(--acc-ink)}
.fab{position:fixed;right:max(16px,calc(50% - 284px));bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:14;width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -12px rgba(0,0,0,.45);cursor:pointer}
.fab:active{transform:scale(.96)}

/* fiches */
.sheet-wrap{position:fixed;inset:0;z-index:30;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:600px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .24s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line-2);margin:2px auto 10px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sh-head h2{margin:0;font-size:24px;font-weight:800}
.sh-form{display:flex;flex-direction:column;gap:14px}
.row2{display:flex;gap:10px}
.row2>*{flex:1;min-width:0}
.mood{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;text-align:left}
.mood.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--fg) inset}
.tk{position:relative;display:flex;align-items:stretch;width:100%;text-align:left;border:1px solid var(--line);padding:0;border-radius:16px;background:var(--surface-2);cursor:pointer}
.tk.on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg) inset}
.tk-stub{width:52px;flex:0 0 auto;border-radius:15px 0 0 15px;display:flex;align-items:center;justify-content:center;min-height:74px}
.tk-code{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.16em;color:#FFFFFF}
.tk-body{flex:1;min-width:0;padding:11px 14px;display:flex;flex-direction:column;gap:2px;border-left:2px dashed var(--line-2)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--toast);color:var(--toast-fg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:14px;z-index:40;box-shadow:0 18px 40px -18px rgba(0,0,0,.5);max-width:calc(100% - 32px);animation:fade .2s ease}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:10px;min-height:36px;padding:0 12px;font-size:13px;font-weight:600;cursor:pointer}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
button:focus-visible,.field:focus-visible,.ck:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:360px){.cover-t{font-size:29px}.pass-stub{width:100px}.pass-code{font-size:22px}.flap{width:24px;height:36px;font-size:21px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<style>img{max-width:100%}[hidden]{display:none!important}.top{top:0;padding-top:calc(8px + env(safe-area-inset-top,0px))}</style>

<body>


<div id="root"></div>
<div id="sheet-root"></div>
<div id="toast-root"></div>

<script>
(function () {
  'use strict';
  var $root = document.getElementById('root'), $sheet = document.getElementById('sheet-root'), $toast = document.getElementById('toast-root');

        inp('e-note', 'note', 'Note', 'text', ' placeholder="Optionnel" autocomplete="off"') +
        (f.err ? '<div class="urgent sm b">' + esc(f.err) + '</div>' : '') +
        '<button class="btn btn-p btn-w" type="submit">' + (isNewE ? 'Ajouter' : 'Enregistrer') + '</button>' +
        (isNewE ? '' : '<button type="button" class="btn btn-g btn-w" style="color:var(--danger)" data-act="del-exp">Supprimer</button>') + '</form>';
    } else if (s === 'act' && c) {
      var isNewA = !f.id;
      h = sheetHead(isNewA ? 'Nouvelle activité' : 'Modifier l’activité') + '<form data-form="act" class="sh-form">' +
        '<div><span class="lbl">Type</span>' + chips('type', Object.keys(TYPES).map(function (k) { return [k, TYPES[k][0]]; })) + '</div>' +
        inp('a-title', 'title', 'Quoi', 'text', ' placeholder="Ex. Excursion en bateau" autocomplete="off"') +
        '<div class="row2">' + inp('a-time', 'time', 'Heure', 'time') + inp('a-cost', 'cost', 'Coût €', 'text', ' inputmode="decimal" placeholder="0"') + '</div>' +
        inp('a-place', 'place', 'Où', 'text', ' placeholder="Optionnel" autocomplete="off"') +
        '<div><label class="lbl" for="a-day">Jour</label><select id="a-day" class="field" data-f="day"><option value=""' + (!f.day ? ' selected' : '') + '>Idée, pas encore datée</option>' + c.days.map(function (ds, i) { var sp = stopFor(c.stops, ds); return '<option value="' + ds + '"' + (f.day === ds ? ' selected' : '') + '>' + esc('J' + (i + 1) + ' · ' + fdw(ds) + (sp ? ' · ' + sp.name : '')) + '</option>'; }).join('') + '</select></div>' +
        '<div><span class="lbl">Statut</span>' + chips('status', [['todo', 'À caler'], ['booked', 'Réservé'], ['done', 'Fait']]) + '</div>' +
        (f.err ? '<div class="urgent sm b">' + esc(f.err) + '</div>' : '') +
        '<button class="btn btn-p btn-w" type="submit">' + (isNewA ? 'Ajouter' : 'Enregistrer') + '</button>' +
        (isNewA ? '' : '<button type="button" class="btn btn-g btn-w" style="color:var(--danger)" data-act="del-act">Supprimer</button>') + '</form>';
    } else if (s === 'chk') {
      h = sheetHead('Ajouter à la valise') + '<form data-form="chk" class="sh-form">' + inp('c-label', 'label', 'À ne pas oublier', 'text', ' placeholder="Ex. Chargeur GoPro, réserver le taxi…" autocomplete="off"') +
        '<div><span class="lbl">Rubrique</span><div style="display:flex;flex-wrap:wrap;gap:8px">' + GROUPS.map(function (g) { return '<button type="button" class="pill' + (f.group === g ? ' on' : '') + '" data-act="f-set" data-key="group" data-val="' + esc(g) + '">' + esc(g) + '</button>'; }).join('') + '</div></div>' +
        '<button class="btn btn-p btn-w" type="submit">Ajouter</button></form>';
    } else if (s === 'stops' && c) {
      h = sheetHead('Étapes du voyage') + '<p class="muted sm" style="margin:-6px 0 12px">Une étape = un lieu où vous dormez. Les jours et le budget s’organisent autour.</p><div class="sh-form">' +
        c.stops.map(function (x) {
          return '<div class="card" style="padding:12px;box-shadow:none;background:var(--surface-2)"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span class="dot" style="width:12px;height:12px;background:' + x.color + '"></span><input class="field" style="flex:1;min-height:44px" aria-label="Nom de l’étape" data-stop="' + esc(x.id) + '|name" value="' + esc(x.name) + '"><button class="x-btn" data-act="del-stop" data-id="' + esc(x.id) + '" aria-label="Supprimer l’étape ' + esc(x.name) + '">' + IC.x + '</button></div>' +
            '<div class="row2"><div><span class="lbl">Arrivée</span><input class="field" type="date" aria-label="Arrivée" data-stop="' + esc(x.id) + '|start" value="' + esc(x.start) + '"></div><div><span class="lbl">Départ · ' + pl(x.nights, 'nuit', 'nuits') + '</span><input class="field" type="date" aria-label="Départ" data-stop="' + esc(x.id) + '|end" value="' + esc(x.end) + '"></div></div></div>';
        }).join('') + '<button class="btn btn-g btn-w" data-act="add-stop">' + IC.plusS + 'Ajouter une étape</button></div>';
    }
    $sheet.innerHTML = '<div class="sheet-wrap" data-backdrop="1"><div class="sheet" role="dialog" aria-modal="true">' + '<div class="grab"></div>' + h + '</div></div>';
    document.body.style.overflow = 'hidden';
  }
  function openSheet(type, form) { ui.sheet = type; ui.form = form || {}; renderSheet(); }
  function closeSheet() { ui.sheet = null; ui.form = {}; renderSheet(); }

  /* ============ toast ============ */
  var toastTimer = null, toastUndo = null;
  function toast(msg, undo) {
    clearTimeout(toastTimer); toastUndo = undo || null;
    $toast.innerHTML = '<div class="toast" role="status"><span>' + esc(msg) + '</span>' + (undo ? '<button type="button" data-undo="1">Annuler</button>' : '') + '</div>';
    toastTimer = setTimeout(function () { $toast.innerHTML = ''; toastUndo = null; }, undo ? 6000 : 3000);
  }

  /* ============ actions ============ */
  function commit() { save(); render(); }
  function find(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function removeWithUndo(list, item, label) {
    var i = list.indexOf(item); if (i < 0) return;
    list.splice(i, 1); commit();
    toast(label + ' supprimé', function () { list.splice(Math.min(i, list.length), 0, item); commit(); });
  }
  function dayFor(tr) { var td = today(); if (ui.day && ui.day >= tr.start && ui.day <= tr.end) return ui.day; return td >= tr.start && td <= tr.end ? td : tr.start; }

  document.addEventListener('click', function (ev) {
    if (ev.target.closest('[data-undo]')) { var u = toastUndo; toastUndo = null; $toast.innerHTML = ''; if (u) u(); return; }
    if (ev.target.hasAttribute && ev.target.hasAttribute('data-backdrop')) { closeSheet(); return; }
    var t = ev.target.closest('[data-act]'); if (!t) return;
    var act = t.dataset.act, id = t.dataset.id, arg = t.dataset.arg, tr = currentTrip(), it;
    switch (act) {
      case 'tab': ui.tab = arg; saveUi(); render(); try { window.scrollTo(0, 0); } catch (e) { } return;
      case 'sheet': openSheet(arg, {}); return;
      case 'close-sheet': closeSheet(); return;
      case 'theme-toggle': themePref = isDark() ? 'light' : 'dark'; lsSet('carnet-poche-theme', themePref); applyTheme(); render(); return;
      case 'theme-set': themePref = arg; lsSet('carnet-poche-theme', themePref); applyTheme(); render(); renderSheet(); return;
      case 'pick-trip': ui.sel = id; ui.day = null; ui.expStop = 'all'; saveUi(); closeSheet(); render(); try { window.scrollTo(0, 0); } catch (e) { } return;
      case 'new-trip': var t0 = today(); openSheet('trip-form', { name: '', dest: '', from: 'BRU', to: '', start: addDays(t0, 30), end: addDays(t0, 32), travelers: '2', currency: 'EUR', rate: '1', budget: '', template: 'city', mood: 'ville' }); return;
      case 'edit-trip': if (tr) openSheet('trip-form', { id: tr.id, name: tr.name, dest: tr.dest, from: tr.from, to: tr.to, start: tr.start, end: tr.end, travelers: tr.travelers, currency: tr.currency, rate: tr.rate, budget: tr.budget, mood: tr.mood }); return;
      case 'tpl': ui.form.template = arg; ui.form.mood = t.dataset.mood || ui.form.mood; renderSheet(); return;
      case 'f-set': ui.form[t.dataset.key] = t.dataset.val; renderSheet(); return;
      case 'del-trip': if (!tr) return; data.trips = data.trips.filter(function (x) { return x.id !== ui.form.id; }); ui.sel = null; ui.tab = 'apercu'; saveUi(); closeSheet(); commit(); toast('Voyage supprimé'); return;
      case 'leg': ui.tab = 'prog'; ui.day = arg; saveUi(); render(); try { window.scrollTo(0, 0); } catch (e) { } return;
      case 'day': ui.day = arg; render(); return;
      case 'bud-view': ui.budView = arg; saveUi(); render(); return;
      case 'exp-filter': ui.expFilter = arg; render(); return;
      case 'exp-stop': ui.expStop = arg; render(); return;
      case 'cycle-exp': if (!tr) return; it = find(tr.expenses, id); if (it) { it.state = { prevu: 'reserve', reserve: 'paye', paye: 'prevu' }[it.state] || 'prevu'; commit(); } return;
      case 'cycle-act': if (!tr) return; it = find(tr.activities, id); if (it) { it.status = { todo: 'booked', booked: 'done', done: 'todo' }[it.status] || 'todo'; commit(); } return;
      case 'open-exp': if (!tr) return; it = find(tr.expenses, id); if (it) openSheet('exp', Object.assign({}, it)); return;
      case 'open-act': if (!tr) return; it = find(tr.activities, id); if (it) openSheet('act', Object.assign({}, it)); return;
      case 'new-exp': if (tr) openSheet('exp', { label: '', amount: '', cur: 'EUR', cat: 'repas', state: 'paye', kind: 'dep', stop: tr ? (stopFor(tr.stops, dayFor(tr)) || {}).id || '' : '', ref: '', deadline: '', charge: '', note: '' }); return;
      case 'new-resa': if (tr) openSheet('exp', { label: '', amount: '', cur: 'EUR', cat: 'logement', state: 'prevu', kind: 'resa', stop: '', ref: '', deadline: '', charge: '', note: '' }); return;
      case 'new-act': if (tr) openSheet('act', { title: '', time: '', place: '', cost: '', type: 'act', status: 'todo', day: dayFor(tr) }); return;
      case 'new-chk': openSheet('chk', { label: '', group: 'Documents' }); return;
      case 'del-exp': if (!tr) return; it = find(tr.expenses, ui.form.id); closeSheet(); if (it) removeWithUndo(tr.expenses, it, '« ' + it.label + ' »'); return;
      case 'del-act': if (!tr) return; it = find(tr.activities, ui.form.id); closeSheet(); if (it) removeWithUndo(tr.activities, it, '« ' + it.title + ' »'); return;
      case 'del-chk': if (!tr) return; it = find(tr.checklist, id); if (it) removeWithUndo(tr.checklist, it, '« ' + it.label + ' »'); return;
      case 'plan-idea': if (!tr) return; it = find(tr.activities, id); if (it) { it.day = dayFor(tr); commit(); toast('Placé le ' + fd(it.day)); } return;
      case 'toggle-hide': ui.hideDone = !ui.hideDone; saveUi(); render(); return;
      case 'ask-reset': ui.confirmReset = true; render(); return;
      case 'cancel-reset': ui.confirmReset = false; render(); return;
      case 'reset-check': if (tr) tr.checklist.forEach(function (x) { x.done = false; }); ui.confirmReset = false; commit(); return;
      case 'add-stop':
        if (!tr) return;
        var srt = tr.stops.slice().sort(function (a, b) { return a.start < b.start ? -1 : 1; });
        var last = srt.length ? srt[srt.length - 1].end : tr.start, s0 = last && last < tr.end ? last : tr.start, e0 = addDays(s0, 1) > tr.end ? tr.end : addDays(s0, 1);
        tr.stops.push({ id: uid(), name: 'Nouvelle étape', start: s0, end: e0 }); commit(); renderSheet(); return;
      case 'del-stop': if (!tr) return; tr.stops = tr.stops.filter(function (x) { return x.id !== id; }); tr.expenses.forEach(function (e) { if (e.stop === id) e.stop = ''; }); commit(); renderSheet(); return;
      case 'backup':
        var txt = JSON.stringify(data);
        var done = function () { toast('Sauvegarde copiée'); };
        var fallback = function () { ui.form.backupText = txt; renderSheet(); var el = document.getElementById('backup-out'); if (el) { el.focus(); el.select(); } };
        try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback); else fallback(); } catch (e) { fallback(); }
        return;
    }
  });

  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (el.dataset.f) {
      ui.form[el.dataset.f] = el.value;
      if ((el.dataset.f === 'amount' || el.dataset.f === 'cur') && ui.sheet === 'exp') {
        var tr = currentTrip(), p = document.getElementById('e-prev');
        if (tr && p) { var r = tr.currency === 'EUR' ? 1 : (num(tr.rate) || 1); p.textContent = ui.form.cur === 'LOC' && num(ui.form.amount) && tr.currency !== 'EUR' ? '≈ ' + eur(num(ui.form.amount) / r) : ''; }
      }
      return;
    }
    if (el.dataset.ui) { ui[el.dataset.ui] = el.value; return; }
    if (el.dataset.notes) { var t = currentTrip(); if (t) { t.notes = el.value; clearTimeout(notesTimer); notesTimer = setTimeout(save, 400); } }
  });
  var notesTimer = null;

  document.addEventListener('change', function (ev) {
    var el = ev.target, tr = currentTrip();
    if (el.dataset.f) { ui.form[el.dataset.f] = el.value; return; }
    if (!tr) return;
    if (el.dataset.check) { var it = find(tr.checklist, el.dataset.check); if (it) { it.done = el.checked; commit(); } return; }
    if (el.dataset.plan) { tr.plan[el.dataset.plan] = el.value; commit(); return; }
    if (el.dataset.stop) { var q = el.dataset.stop.split('|'), s = find(tr.stops, q[0]); if (s) { s[q[1]] = el.value; commit(); renderSheet(); } return; }
    if (el.dataset.notes) { clearTimeout(notesTimer); save(); }
  });

  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var kind = ev.target.dataset.form, tr = currentTrip(), f = ui.form, now = Date.now();
    if (kind === 'trip') {
      if (!String(f.name || '').trim() || !f.start || !f.end) { f.err = 'Le nom et les deux dates sont nécessaires.'; renderSheet(); return; }
      if (f.end < f.start) { f.err = 'Le retour tombe avant le départ.'; renderSheet(); return; }
      var cur = String(f.currency || 'EUR').trim().toUpperCase().slice(0, 3) || 'EUR';
      var base = { name: String(f.name).trim(), dest: String(f.dest || '').trim(), from: String(f.from || '').trim().toUpperCase().slice(0, 3), to: String(f.to || '').trim().toUpperCase().slice(0, 3), start: f.start, end: f.end, travelers: String(Math.max(1, parseInt(f.travelers, 10) || 1)), currency: cur, rate: cur === 'EUR' ? '1' : String(f.rate || '1'), budget: String(f.budget || ''), mood: f.mood || 'ville' };
      if (f.id) { var t0 = find(data.trips, f.id); if (t0) Object.assign(t0, base); }
      else { var nt = normTrip(Object.assign({ id: uid(), checklist: tpl(f.template) }, base)); data.trips.push(nt); ui.sel = nt.id; ui.tab = 'apercu'; ui.day = null; saveUi(); }
      closeSheet(); commit(); return;
    }
    if (kind === 'restore') {
      if (!f.confirmRestore) { checkRestore(); return; }
      doRestore(f.parsed); return;
    }
    if (!tr) return;
    if (kind === 'idea') { var v = String(ui.idea || '').trim(); if (!v) return; try { document.activeElement.blur(); } catch (e) { } tr.activities.push({ id: uid(), day: '', time: '', title: v, place: '', cost: '', type: 'act', status: 'todo', order: now }); ui.idea = ''; commit(); return; }
    if (kind === 'exp') {
      if (!String(f.label || '').trim()) { f.err = 'Donnez un libellé à la dépense.'; renderSheet(); return; }
      var body = { label: String(f.label).trim(), amount: String(f.amount || '').replace(/\s/g, ''), cur: f.cur || 'EUR', cat: f.cat || 'autre', state: f.state || 'prevu', kind: f.kind || 'dep', stop: f.stop || '', ref: f.ref || '', deadline: f.deadline || '', charge: f.charge || '', note: f.note || '' };
      if (f.id) { var e0 = find(tr.expenses, f.id); if (e0) Object.assign(e0, body); toast('Enregistré'); }
      else { tr.expenses.push(Object.assign({ id: uid(), when: '', order: now }, body)); toast('Ajouté'); }
      closeSheet(); commit(); return;
    }
    if (kind === 'act') {
      if (!String(f.title || '').trim()) { f.err = 'Indiquez ce que vous allez faire.'; renderSheet(); return; }
      var ab = { title: String(f.title).trim(), time: f.time || '', place: f.place || '', cost: f.cost || '', type: f.type || 'act', status: f.status || 'todo', day: f.day || '' };
      if (f.id) { var a0 = find(tr.activities, f.id); if (a0) Object.assign(a0, ab); }
      else { tr.activities.push(Object.assign({ id: uid(), order: now }, ab)); if (ab.day) ui.day = ab.day; }
      closeSheet(); commit(); return;
    }
    if (kind === 'chk') {
      if (!String(f.label || '').trim()) return;
      tr.checklist.push({ id: uid(), group: f.group || 'Divers', label: String(f.label).trim(), done: false, order: now });
      f.label = ''; commit(); renderSheet(); toast('Ajouté à « ' + (f.group || 'Divers') + ' »'); return;
    }
  });

  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && ui.sheet) closeSheet(); });

  /* ============ restauration ============ */
  function parseBackup(txt) {
    txt = String(txt || '').trim();
    if (txt.indexOf('CARNET1:') === 0) {
      if (typeof DecompressionStream === 'undefined') return Promise.reject(new Error('old'));
      try {
        var bin = atob(txt.slice(8).replace(/\s/g, '').replace(/-/g, '+').replace(/_/g, '/'));
        var bytes = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        return new Response(stream).text().then(function (s) { var d = JSON.parse(s); if (!d || !Array.isArray(d.trips)) throw new Error('bad'); return d; });
      } catch (e) { return Promise.reject(e); }
    }
    return new Promise(function (res, rej) { try { var d = JSON.parse(txt); if (!d || !Array.isArray(d.trips)) throw new Error('bad'); res(d); } catch (e) { rej(e); } });
  }
  function doRestore(d) {
    data = { v: 1, trips: d.trips.map(normTrip) }; ui.sel = null; ui.tab = 'apercu'; saveUi(); closeSheet(); commit();
    toast(pl(data.trips.length, 'voyage restauré', 'voyages restaurés'));
  }
  function checkRestore() {
    var f = ui.form;
    parseBackup(f.restore).then(function (d) {
      if (!data.trips.length) { doRestore(d); return; }
      f.parsed = d; f.confirmRestore = true; f.restoreErr = ''; renderSheet();
    }, function (e) {
      f.restoreErr = e && e.message === 'old' ? 'Cette sauvegarde compressée demande iOS 16.4 ou plus récent.' : 'Ce texte n’est pas une sauvegarde du carnet. Copiez le texte en entier, puis réessayez.';
      renderSheet();
    });
  }
  document.addEventListener('click', function (ev) {
    if (!ev.target.closest('[data-act="paste-restore"]')) return;
    var fail = function () { ui.form.restoreErr = 'Collage automatique refusé : faites un appui long dans le champ ci-dessous, puis « Coller ».'; renderSheet(); };
    try {
      if (!navigator.clipboard || !navigator.clipboard.readText) { fail(); return; }
      navigator.clipboard.readText().then(function (t) { if (!t) { fail(); return; } ui.form.restore = t; checkRestore(); }, fail);
    } catch (e) { fail(); }
  });

  render();
})();
</script>
